schedules:
- cron: "0 12 * * 0,2,4"
  displayName: Scheduled build
  branches:
    include:
    - main
  always: true

jobs:
  - job: MacOS
    pool:
      vmImage: macOS-latest
    strategy:
      matrix:
        Python314:
          python.version: "3.14"
          TOXENV: "py314"
      maxParallel: 1
    steps:
      - template: darwin/continuous-build-darwin.yml

  - job: Windows
    pool:
      vmImage: windows-2022
    strategy:
      matrix:
        Python311:
          python.version: "3.11"
          TOXENV: "py311"
        Python312:
          python.version: "3.12"
          TOXENV: "py312"
        Python313:
          python.version: "3.13"
          TOXENV: "py313"
        Python314:
          python.version: "3.14"
          TOXENV: "py314"
      maxParallel: 1
    steps:
      # GUARD: windows-2022 VMs sometimes boot with the Docker service stopped, which aborts pytest at collection (test_cli.py builds EdgeDockerClient() at import); start the daemon and wait so a cold daemon self-heals or fails here clearly.
      - powershell: |
          $ErrorActionPreference = 'Continue'
          Write-Host '=== ensure Docker service is running ==='
          $svc = Get-Service docker -ErrorAction SilentlyContinue
          if ($null -eq $svc) {
            Write-Host 'Docker service "docker" not found via Get-Service.'
          } else {
            Write-Host "Docker service status = $($svc.Status)"
            if ($svc.Status -ne 'Running') {
              Write-Host 'Starting Docker service...'
              Start-Service docker
            }
          }
          Write-Host '=== wait for Docker daemon to respond (up to 3 min) ==='
          $ok = $false
          $deadline = (Get-Date).AddMinutes(3)
          while (-not $ok -and (Get-Date) -lt $deadline) {
            docker info --format '{{.OSType}}' 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) { $ok = $true } else { Start-Sleep -Seconds 5 }
          }
          Write-Host "docker daemon reachable = $ok"
          if (-not $ok) {
            Write-Error 'Docker daemon did not become reachable; failing early so the cause is unambiguous.'
            exit 1
          }
        displayName: "GUARD: ensure Docker daemon is running"

      - template: win32/continuous-build-win32.yml

  - job: Linux2004
    dependsOn: Windows
    pool:
      vmImage: ubuntu-22.04
    strategy:
      matrix:
        Python311:
          python.version: "3.11"
          TOXENV: "py311"
        Python312:
          python.version: "3.12"
          TOXENV: "py312"
        Python313:
          python.version: "3.13"
          TOXENV: "py313"
        Python314:
          python.version: "3.14"
          TOXENV: "py314"
      maxParallel: 1
    steps:
      # Pass the ARM service connection (pipeline var `AZURE_SERVICE_CONNECTION`) so the template runs tests under AzureCLI@2 with Azure AD login; unset = legacy fallback.
      - template: linux/continuous-build-linux.yml
        parameters:
          azureServiceConnection: "$(AZURE_SERVICE_CONNECTION)"

  - job: Linux2204
    dependsOn: Linux2004
    pool:
      vmImage: ubuntu-22.04
    strategy:
      matrix:
        Python311:
          python.version: "3.11"
          TOXENV: "py311"
        Python312:
          python.version: "3.12"
          TOXENV: "py312"
        Python313:
          python.version: "3.13"
          TOXENV: "py313"
        Python314:
          python.version: "3.14"
          TOXENV: "py314"
      maxParallel: 1
    steps:
      # Pass the ARM service connection (pipeline var `AZURE_SERVICE_CONNECTION`) so the template runs tests under AzureCLI@2 with Azure AD login; unset = legacy fallback.
      - template: linux/continuous-build-linux.yml
        parameters:
          azureServiceConnection: "$(AZURE_SERVICE_CONNECTION)"

  
